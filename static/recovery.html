<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;color:#555;}</style>
</head>
<body>
<p>Redirecting to KnowSay...</p>
<script>
(function() {
    var hash = window.location.hash;
    if (hash && hash.indexOf('type=recovery') !== -1) {
        var qs = hash.substring(1);
        window.location.replace('/?' + qs);
    } else if (hash) {
        window.location.replace('/?' + hash.substring(1));
    } else {
        window.location.replace('/');
    }
})();
</script>
</body>
</html>
