[project]
name = "knowsay"
version = "0.1.0"
description = "Property & economic data for Malaysia — not hearsay, not guesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "seaborn>=0.13.2",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "supabase>=2.30.0",
    "dotenv>=0.9.9",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
